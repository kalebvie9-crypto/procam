name: Construire ProCam

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Créer le projet Android
        run: |
          set -e
          mkdir -p ProCam/app/src/main/java/com/example/procam
          cd ProCam
          cat > settings.gradle.kts <<'PROCAM_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ProCam"
          include(":app")
          PROCAM_EOF
          cat > build.gradle.kts <<'PROCAM_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          PROCAM_EOF
          cat > gradle.properties <<'PROCAM_EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          PROCAM_EOF
          cat > app/build.gradle.kts <<'PROCAM_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.procam"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.procam"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              val camerax = "1.5.1"
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.camera:camera-core:$camerax")
              implementation("androidx.camera:camera-camera2:$camerax")
              implementation("androidx.camera:camera-lifecycle:$camerax")
              implementation("androidx.camera:camera-view:$camerax")
              implementation("androidx.camera:camera-extensions:$camerax")
              implementation("androidx.camera:camera-video:$camerax")
          }
          PROCAM_EOF
          cat > app/src/main/AndroidManifest.xml <<'PROCAM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="ProCam"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PROCAM_EOF
          cat > app/src/main/java/com/example/procam/MainActivity.kt <<'PROCAM_EOF'
          package com.example.procam

          import android.Manifest
          import android.content.ContentValues
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CaptureRequest
          import android.os.Bundle
          import android.provider.MediaStore
          import android.util.Range
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.annotation.OptIn
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.camera2.interop.Camera2CameraControl
          import androidx.camera.camera2.interop.Camera2CameraInfo
          import androidx.camera.camera2.interop.CaptureRequestOptions
          import androidx.camera.camera2.interop.ExperimentalCamera2Interop
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.Preview
          import androidx.camera.extensions.ExtensionMode
          import androidx.camera.extensions.ExtensionsManager
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.video.FallbackStrategy
          import androidx.camera.video.MediaStoreOutputOptions
          import androidx.camera.video.Quality
          import androidx.camera.video.QualitySelector
          import androidx.camera.video.Recorder
          import androidx.camera.video.Recording
          import androidx.camera.video.VideoCapture
          import androidx.camera.video.VideoRecordEvent
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import java.text.SimpleDateFormat
          import java.util.Locale
          import kotlin.math.exp
          import kotlin.math.ln
          import kotlin.math.roundToInt

          /**
           * ProCam : photo (JPEG max, RAW+JPEG DNG), vidéo jusqu'en 4K, mode Pro (ISO et
           * vitesse manuels) et modes HDR / Nuit / Portrait / Beauté fournis par le
           * constructeur du téléphone, quand ils existent.
           */
          @OptIn(ExperimentalCamera2Interop::class)
          class MainActivity : AppCompatActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var modeRow: LinearLayout
              private lateinit var modeScroll: HorizontalScrollView
              private lateinit var flashBtn: TextView
              private lateinit var photoTab: TextView
              private lateinit var videoTab: TextView
              private lateinit var proBtn: TextView
              private lateinit var rawBtn: TextView
              private lateinit var proPanel: LinearLayout
              private lateinit var isoLabel: TextView
              private lateinit var expLabel: TextView
              private lateinit var isoBar: SeekBar
              private lateinit var expBar: SeekBar
              private lateinit var shutterBg: GradientDrawable

              private var provider: ProcessCameraProvider? = null
              private var ext: ExtensionsManager? = null
              private var camera: Camera? = null
              private var imageCapture: ImageCapture? = null
              private var videoCapture: VideoCapture<Recorder>? = null
              private var recording: Recording? = null

              private var lensFacing = CameraSelector.LENS_FACING_BACK
              private var mode = ExtensionMode.NONE
              private var flash = ImageCapture.FLASH_MODE_OFF
              private var scaling = false

              private var videoMode = false
              private var pro = false
              private var wantRaw = false
              private var rawSupported = false
              private var activeRaw = false
              private var isoRange: Range<Int>? = null
              private var expRange: Range<Long>? = null

              private val modes = listOf(
                  ExtensionMode.NONE to "Auto",
                  ExtensionMode.HDR to "HDR",
                  ExtensionMode.NIGHT to "Nuit",
                  ExtensionMode.BOKEH to "Portrait",
                  ExtensionMode.FACE_RETOUCH to "Beauté"
              )

              private val camPermission = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { ok -> if (ok) startCamera() else toast("Autorise l'appareil photo pour continuer.") }

              private val micPermission = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { /* sans micro, la vidéo est enregistrée sans son */ }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
              private fun stamp() = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US)
                  .format(System.currentTimeMillis())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildUi()
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                      == PackageManager.PERMISSION_GRANTED
                  ) startCamera() else camPermission.launch(Manifest.permission.CAMERA)
              }

              override fun onDestroy() {
                  recording?.stop()
                  super.onDestroy()
              }

              // ---------------------------------------------------------------- UI

              private fun label(t: String) = TextView(this).apply {
                  text = t
                  setTextColor(Color.WHITE)
                  textSize = 15f
                  setPadding(dp(14), dp(10), dp(14), dp(10))
              }

              private fun tint(v: TextView, on: Boolean) =
                  v.setTextColor(if (on) Color.parseColor("#FFD54F") else Color.WHITE)

              private fun buildUi() {
                  val root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
                  previewView = PreviewView(this).apply { scaleType = PreviewView.ScaleType.FIT_CENTER }
                  root.addView(previewView, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))
                  setupTouch()

                  val bottom = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(0, dp(8), 0, dp(24))
                      setBackgroundColor(Color.parseColor("#99000000"))
                  }

                  // Panneau Pro (ISO + vitesse)
                  proPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(24), dp(4), dp(24), dp(4))
                      visibility = View.GONE
                  }
                  isoLabel = label("ISO").apply { setPadding(0, 0, 0, 0) }
                  expLabel = label("Vitesse").apply { setPadding(0, dp(6), 0, 0) }
                  val listener = object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          updateProLabels(); applyManual()
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  }
                  isoBar = SeekBar(this).apply { max = 100; progress = 30; setOnSeekBarChangeListener(listener) }
                  expBar = SeekBar(this).apply { max = 100; progress = 55; setOnSeekBarChangeListener(listener) }
                  proPanel.addView(isoLabel); proPanel.addView(isoBar)
                  proPanel.addView(expLabel); proPanel.addView(expBar)
                  bottom.addView(proPanel, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))

                  // Rangée d'outils : Photo | Vidéo | Pro | RAW
                  val tools = LinearLayout(this).apply { gravity = Gravity.CENTER }
                  photoTab = label("Photo").apply { setOnClickListener { setVideoMode(false) } }
                  videoTab = label("Vidéo").apply { setOnClickListener { setVideoMode(true) } }
                  proBtn = label("Pro").apply {
                      setOnClickListener {
                          pro = !pro
                          if (pro) mode = ExtensionMode.NONE
                          buildModes(); bind(); refreshUi()
                      }
                  }
                  rawBtn = label("JPEG").apply {
                      setOnClickListener { wantRaw = !wantRaw; bind(); refreshUi() }
                  }
                  tools.addView(photoTab); tools.addView(videoTab); tools.addView(proBtn); tools.addView(rawBtn)
                  bottom.addView(tools, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT))

                  // Modes constructeur
                  modeRow = LinearLayout(this).apply { gravity = Gravity.CENTER }
                  modeScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      addView(modeRow)
                  }
                  bottom.addView(modeScroll, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT))

                  // Flash | Déclencheur | Retourner
                  val controls = LinearLayout(this).apply {
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(24), dp(12), dp(24), 0)
                      weightSum = 3f
                  }
                  flashBtn = label("Flash : off").apply {
                      gravity = Gravity.CENTER
                      setOnClickListener { cycleFlash() }
                  }
                  controls.addView(flashBtn, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))

                  shutterBg = GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(Color.WHITE)
                      setStroke(dp(4), Color.parseColor("#88FFFFFF"))
                  }
                  val shutter = View(this).apply {
                      background = shutterBg
                      contentDescription = "Déclencheur"
                      setOnClickListener { if (videoMode) toggleRecording() else takePhoto() }
                  }
                  controls.addView(shutter, LinearLayout.LayoutParams(dp(72), dp(72)))

                  val flip = label("Retourner").apply {
                      gravity = Gravity.CENTER
                      setOnClickListener {
                          if (recording != null) return@setOnClickListener
                          lensFacing = if (lensFacing == CameraSelector.LENS_FACING_BACK)
                              CameraSelector.LENS_FACING_FRONT else CameraSelector.LENS_FACING_BACK
                          buildModes(); bind(); refreshUi()
                      }
                  }
                  controls.addView(flip, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  bottom.addView(controls, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))

                  root.addView(bottom, FrameLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT, Gravity.BOTTOM))
                  setContentView(root)
                  refreshUi()
              }

              private fun refreshUi() {
                  tint(photoTab, !videoMode)
                  tint(videoTab, videoMode)
                  tint(proBtn, pro)
                  proBtn.visibility = if (isoRange != null && expRange != null) View.VISIBLE else View.GONE
                  rawBtn.visibility = if (rawSupported && !videoMode) View.VISIBLE else View.GONE
                  rawBtn.text = if (wantRaw) "RAW+JPEG" else "JPEG"
                  tint(rawBtn, wantRaw)
                  modeScroll.visibility = if (videoMode || pro) View.GONE else View.VISIBLE
                  flashBtn.visibility = if (videoMode) View.INVISIBLE else View.VISIBLE
                  proPanel.visibility = if (pro) View.VISIBLE else View.GONE
                  updateProLabels()
              }

              private fun setVideoMode(v: Boolean) {
                  if (recording != null || v == videoMode) return
                  videoMode = v
                  if (v && ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED
                  ) micPermission.launch(Manifest.permission.RECORD_AUDIO)
                  bind(); refreshUi()
              }

              private fun setupTouch() {
                  val detector = ScaleGestureDetector(this,
                      object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                          override fun onScaleBegin(d: ScaleGestureDetector): Boolean {
                              scaling = true; return true
                          }
                          override fun onScale(d: ScaleGestureDetector): Boolean {
                              val cam = camera ?: return true
                              val cur = cam.cameraInfo.zoomState.value?.zoomRatio ?: 1f
                              cam.cameraControl.setZoomRatio(cur * d.scaleFactor)
                              return true
                          }
                          override fun onScaleEnd(d: ScaleGestureDetector) {
                              previewView.postDelayed({ scaling = false }, 150)
                          }
                      })
                  previewView.setOnTouchListener { v, e ->
                      detector.onTouchEvent(e)
                      if (e.action == MotionEvent.ACTION_UP && !scaling && e.pointerCount == 1) {
                          val pt = previewView.meteringPointFactory.createPoint(e.x, e.y)
                          camera?.cameraControl?.startFocusAndMetering(FocusMeteringAction.Builder(pt).build())
                          v.performClick()
                      }
                      true
                  }
              }

              // ------------------------------------------------------------ Caméra

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      val p = future.get()
                      provider = p
                      val extFuture = ExtensionsManager.getInstanceAsync(this, p)
                      extFuture.addListener({
                          ext = extFuture.get()
                          buildModes(); bind(); refreshUi()
                      }, ContextCompat.getMainExecutor(this))
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun baseSelector() = CameraSelector.Builder().requireLensFacing(lensFacing).build()

              private fun buildModes() {
                  modeRow.removeAllViews()
                                    val base = baseSelector()
                  val available = modes.filter { (m, _) ->
                      m == ExtensionMode.NONE || ext?.isExtensionAvailable(base, m) == true
                  }
                  if (available.none { it.first == mode }) mode = ExtensionMode.NONE
                  for ((m, name) in available) {
                      val tv = label(name)
                      tint(tv, m == mode)
                      tv.setOnClickListener { mode = m; buildModes(); bind() }
                      modeRow.addView(tv)
                  }
              }

              private fun bind(retry: Boolean = true) {
                  val p = provider ?: return
                  val base = baseSelector()
                  val preview = Preview.Builder().build()
                      .also { it.setSurfaceProvider(previewView.surfaceProvider) }
                  try {
                      p.unbindAll()
                      if (videoMode) {
                          val recorder = Recorder.Builder()
                              .setQualitySelector(
                                  QualitySelector.fromOrderedList(
                                      listOf(Quality.UHD, Quality.FHD, Quality.HD),
                                      FallbackStrategy.lowerQualityOrHigherThan(Quality.SD)
                                  )
                              ).build()
                          val vc = VideoCapture.withOutput(recorder)
                          camera = p.bindToLifecycle(this, base, preview, vc)
                          videoCapture = vc; imageCapture = null
                      } else {
                          val selector = if (mode == ExtensionMode.NONE) base
                          else ext!!.getExtensionEnabledCameraSelector(base, mode)
                          val caps = ImageCapture.getImageCaptureCapabilities(p.getCameraInfo(selector))
                          rawSupported = caps.supportedOutputFormats
                              .contains(ImageCapture.OUTPUT_FORMAT_RAW_JPEG)
                          activeRaw = wantRaw && rawSupported
                          val builder = ImageCapture.Builder()
                              .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                              .setFlashMode(flash)
                          if (activeRaw) builder.setOutputFormat(ImageCapture.OUTPUT_FORMAT_RAW_JPEG)
                          else builder.setJpegQuality(100)
                          val ic = builder.build()
                          camera = p.bindToLifecycle(this, selector, preview, ic)
                          imageCapture = ic; videoCapture = null
                      }
                      readSensorRanges()
                      applyManual()
                      refreshUi()
                  } catch (e: Exception) {
                      if (retry) {
                          toast("Option indisponible sur cet appareil, retour au mode standard.")
                          mode = ExtensionMode.NONE; wantRaw = false; pro = false
                          buildModes(); bind(false)
                      } else toast("Impossible d'ouvrir la caméra : ${e.message}")
                  }
              }

              // --------------------------------------------------------- Mode Pro

              private fun readSensorRanges() {
                  val cam = camera ?: return
                  val info = Camera2CameraInfo.from(cam.cameraInfo)
                  isoRange = info.getCameraCharacteristic(CameraCharacteristics.SENSOR_INFO_SENSITIVITY_RANGE)
                  expRange = info.getCameraCharacteristic(CameraCharacteristics.SENSOR_INFO_EXPOSURE_TIME_RANGE)
                  if (isoRange == null || expRange == null) pro = false
              }

              private fun lerpLog(a: Double, b: Double, t: Double) = exp(ln(a) + (ln(b) - ln(a)) * t)

              private fun isoValue(): Int {
                  val r = isoRange ?: return 100
                  val hi = minOf(r.upper, 3200)
                  return lerpLog(r.lower.toDouble(), hi.toDouble(), isoBar.progress / 100.0)
                      .roundToInt().coerceIn(r.lower, r.upper)
              }

              private fun expValue(): Long {
                  val r = expRange ?: return 16_000_000L
                  val lo = maxOf(r.lower, 100_000L)
                  val hi = minOf(r.upper, 1_000_000_000L)
                  return lerpLog(lo.toDouble(), hi.toDouble(), expBar.progress / 100.0)
                      .toLong().coerceIn(r.lower, r.upper)
              }

              private fun updateProLabels() {
                  if (isoRange == null || expRange == null) return
                  isoLabel.text = "ISO ${isoValue()}"
                  val ns = expValue()
                  expLabel.text = if (ns >= 500_000_000L) "Vitesse %.1f s".format(ns / 1e9)
                  else "Vitesse 1/${(1e9 / ns).roundToInt()} s"
              }

              private fun applyManual() {
                  val cam = camera ?: return
                  val c2 = Camera2CameraControl.from(cam.cameraControl)
                  if (!pro) {
                      c2.setCaptureRequestOptions(CaptureRequestOptions.Builder().build())
                      return
                  }
                  c2.setCaptureRequestOptions(
                      CaptureRequestOptions.Builder()
                          .setCaptureRequestOption(CaptureRequest.CONTROL_AE_MODE, CaptureRequest.CONTROL_AE_MODE_OFF)
                          .setCaptureRequestOption(CaptureRequest.SENSOR_SENSITIVITY, isoValue())
                          .setCaptureRequestOption(CaptureRequest.SENSOR_EXPOSURE_TIME, expValue())
                          .build()
                  )
              }

              // ------------------------------------------------------- Capture

              private fun cycleFlash() {
                  flash = when (flash) {
                      ImageCapture.FLASH_MODE_OFF -> ImageCapture.FLASH_MODE_AUTO
                      ImageCapture.FLASH_MODE_AUTO -> ImageCapture.FLASH_MODE_ON
                      else -> ImageCapture.FLASH_MODE_OFF
                  }
                  imageCapture?.flashMode = flash
                  flashBtn.text = when (flash) {
                      ImageCapture.FLASH_MODE_AUTO -> "Flash : auto"
                      ImageCapture.FLASH_MODE_ON -> "Flash : on"
                      else -> "Flash : off"
                  }
              }

              private fun imageOptions(name: String, mime: String): ImageCapture.OutputFileOptions {
                  val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, mime)
                      put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/ProCam")
                  }
                  return ImageCapture.OutputFileOptions.Builder(
                      contentResolver, MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values
                  ).build()
              }

              private fun takePhoto() {
                  val ic = imageCapture ?: return
                  val s = stamp()
                  val cb = object : ImageCapture.OnImageSavedCallback {
                      override fun onImageSaved(r: ImageCapture.OutputFileResults) =
                          toast("Enregistré dans Pictures/ProCam")
                      override fun onError(e: ImageCaptureException) = toast("Échec : ${e.message}")
                  }
                  val executor = ContextCompat.getMainExecutor(this)
                  if (activeRaw) {
                      ic.takePicture(
                          imageOptions("IMG_$s.dng", "image/x-adobe-dng"),
                          imageOptions("IMG_$s", "image/jpeg"),
                          executor, cb
                      )
                  } else {
                      ic.takePicture(imageOptions("IMG_$s", "image/jpeg"), executor, cb)
                  }
              }

              private fun toggleRecording() {
                  val vc = videoCapture ?: return
                  recording?.let { it.stop(); return }

                  val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, "VID_${stamp()}")
                      put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                      put(MediaStore.MediaColumns.RELATIVE_PATH, "Movies/ProCam")
                  }
                  val out = MediaStoreOutputOptions.Builder(
                      contentResolver, MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  ).setContentValues(values).build()

                  var pending = vc.output.prepareRecording(this, out)
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      == PackageManager.PERMISSION_GRANTED
                  ) pending = pending.withAudioEnabled()

                  recording = pending.start(ContextCompat.getMainExecutor(this)) { ev ->
                      if (ev is VideoRecordEvent.Finalize) {
                          recording = null
                          shutterBg.setColor(Color.WHITE)
                          toast(if (ev.hasError()) "Erreur vidéo (code ${ev.error})"
                          else "Vidéo enregistrée dans Movies/ProCam")
                      }
                  }
                  shutterBg.setColor(Color.parseColor("#E53935"))
              }
          }
          PROCAM_EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compiler l'APK
        working-directory: ProCam
        run: gradle assembleDebug --no-daemon
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" ProCam/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" --title "ProCam ${{ github.run_number }}" --notes "APK prêt à installer."
